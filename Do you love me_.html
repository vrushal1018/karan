<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do you love me?</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f4;--bg2:#ffd9e4;--pink:#ff5fa2;--pink-d:#e63d86;--cocoa:#7a4a3a;--ink:#3a2a2e;--paper:#fffaf6;--paper-line:#f4dfd8;--on-pink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--bg2:#3d1f2d;--ink:#ffe9ef;--paper:#3a2430;--paper-line:#4d3341;--cocoa:#f0b9a3}}
:root[data-theme="dark"]{--bg:#2a1620;--bg2:#3d1f2d;--ink:#ffe9ef;--paper:#3a2430;--paper-line:#4d3341;--cocoa:#f0b9a3}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{font-family:'Quicksand',system-ui,sans-serif;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* splash */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:20;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%);transition:opacity .8s}
#splash.out{opacity:0;pointer-events:none}
#splash h1{margin:0;font-family:'Caveat',cursive;font-weight:700;font-size:clamp(2.2rem,9vw,3.6rem);color:var(--pink-d);text-align:center;line-height:1.05;padding:0 20px}
#go{width:112px;height:112px;border-radius:50%;background:var(--pink);box-shadow:0 10px 0 var(--pink-d),0 18px 30px rgba(230,61,134,.35);display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite;transition:transform .15s,box-shadow .15s}
#go:active{transform:translateY(8px);box-shadow:0 2px 0 var(--pink-d)}
#go svg{width:54px;height:54px;animation:nudge 1.6s ease-in-out infinite}
#splash p{margin:0;font-weight:700;opacity:.7}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes nudge{50%{transform:translateX(7px)}}
#bigheart{position:fixed;left:50%;top:50%;font-size:40px;z-index:30;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.2)}
.bit{position:fixed;z-index:30;pointer-events:none;left:0;top:0;will-change:transform,opacity}

/* main */
#main{display:none;max-width:560px;margin:0 auto;padding:28px 18px 80px;text-align:center}
#main.show{display:block}
.duo{width:210px;max-width:60%;margin:0 auto 6px;display:block}
.bubble{display:inline-block;background:#fff;color:#3a2a2e;font-weight:700;font-size:.8rem;padding:7px 13px;border-radius:50%;border:2px solid #3a2a2e;margin-bottom:4px}
.paper{margin-top:10px;text-align:left;background:var(--paper);border-radius:6px 6px 18px 18px;padding:26px 24px 30px;box-shadow:0 14px 34px rgba(122,74,58,.18);background-image:repeating-linear-gradient(transparent 0 33px,var(--paper-line) 33px 34px);position:relative;min-height:220px;cursor:pointer}
.paper::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--pink);border-radius:6px 6px 0 0}
.paper p{font-family:'Caveat',cursive;font-size:1.65rem;line-height:34px;margin:0 0 34px;color:var(--ink)}
.paper p:last-child{margin-bottom:0}
.cur::after{content:"♥";color:var(--pink);margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.skip{font-size:.8rem;opacity:.6;margin-top:10px}

#ask{opacity:0;transform:translateY(16px);transition:all .8s;pointer-events:none;margin-top:44px}
#ask.show{opacity:1;transform:none;pointer-events:auto}
#ask h2{font-size:clamp(2rem,9vw,2.8rem);margin:0 0 18px;font-weight:700}
.btns{display:flex;gap:16px;justify-content:center;min-height:56px}
.btn{padding:13px 34px;border-radius:999px;background:var(--pink);color:var(--on-pink);font-weight:700;font-size:1.15rem;box-shadow:0 5px 0 var(--pink-d);transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
#no{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#hint{margin:16px 0 0;min-height:1.4em;font-weight:700;color:var(--pink-d)}
#no.run{position:fixed;z-index:15;transition:left .25s,top .25s}

#yes-msg{display:none;margin-top:10px}
#yes-msg.show{display:block}
#yes-msg h3{font-family:'Caveat',cursive;font-size:2.6rem;color:var(--pink-d);margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.chips span{background:var(--paper);padding:9px 15px;border-radius:999px;font-weight:700;box-shadow:0 3px 0 var(--paper-line);opacity:0;transform:scale(.7);animation:pop .5s forwards}
@keyframes pop{to{opacity:1;transform:none}}
#rain{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#rain i{position:absolute;top:-30px;font-style:normal;opacity:.5;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg)}}
#main{position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){#go,#go svg{animation:none}}
</style>
</head>
<body>
<div id="rain" aria-hidden="true"></div>

<section id="splash">
  <h1>I made something<br>just for you</h1>
  <button id="go" aria-label="Tap the arrow to open"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 5l7 7-7 7"/></svg></button>
  <p>Tap the arrow</p>
</section>
<div id="bigheart">💖</div>

<main id="main">
  <div class="bubble">Reply me</div>
  <svg class="duo" viewBox="0 0 220 130" role="img" aria-label="A cat and a panda cuddling">
    <g><polygon points="48,56 54,12 88,40" fill="#e8934a"/><polygon points="132,56 126,12 92,40" fill="#e8934a"/>
    <polygon points="57,42 59,24 76,37" fill="#ffb3c7"/><polygon points="123,42 121,24 104,37" fill="#ffb3c7"/>
    <ellipse cx="90" cy="82" rx="52" ry="44" fill="#f5a85c"/>
    <path d="M90 40v12M78 42l3 10M102 42l-3 10" stroke="#d97e34" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="88" r="9" fill="#ff9fc0" opacity=".75"/><circle cx="120" cy="88" r="9" fill="#ff9fc0" opacity=".75"/>
    <ellipse cx="72" cy="76" rx="5" ry="7" fill="#3a2a2e"/><ellipse cx="108" cy="76" rx="5" ry="7" fill="#3a2a2e"/>
    <circle cx="73.5" cy="73" r="2" fill="#fff"/><circle cx="109.5" cy="73" r="2" fill="#fff"/>
    <polygon points="85,86 95,86 90,92" fill="#ff7fa8"/>
    <path d="M90 92v3M90 95q-5 5-10 1M90 95q5 5 10 1" stroke="#3a2a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M52 90l-18-4M52 96l-18 4M128 90l18-4M128 96l18 4" stroke="#3a2a2e" stroke-width="1.8" stroke-linecap="round" opacity=".7"/></g>
    <g><circle cx="140" cy="30" r="15" fill="#3a2a2e"/><circle cx="196" cy="30" r="15" fill="#3a2a2e"/>
    <ellipse cx="168" cy="76" rx="48" ry="42" fill="#fff"/>
    <circle cx="144" cy="82" r="9" fill="#ff9fc0" opacity=".8"/><circle cx="192" cy="82" r="9" fill="#ff9fc0" opacity=".8"/>
    <ellipse cx="152" cy="68" rx="9" ry="11" fill="#3a2a2e" transform="rotate(20 152 68)"/><ellipse cx="184" cy="68" rx="9" ry="11" fill="#3a2a2e" transform="rotate(-20 184 68)"/>
    <circle cx="153" cy="66" r="2.5" fill="#fff"/><circle cx="183" cy="66" r="2.5" fill="#fff"/>
    <ellipse cx="168" cy="82" rx="5" ry="3.5" fill="#3a2a2e"/><path d="M162 90q6 6 12 0" stroke="#3a2a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
    <text x="104" y="24" font-size="18" text-anchor="middle">💗</text>
  </svg>

  <div class="paper" id="paper" title="Tap to show the whole letter"></div>
  <div class="skip" id="skip">Tap the letter to read it faster</div>

  <div id="ask">
    <h2>Do you love me?</h2>
    <div class="btns">
      <button class="btn" id="yes">Yes</button>
      <button class="btn" id="no">No</button>
    </div>
    <p id="hint" aria-live="polite"></p>
    <div id="yes-msg">
      <h3>I knew it. I love you more.</h3>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</main>

<script>
// Change these two names to make it yours
var TO = "my love", FROM = "Karan";

var LETTER = [
  "Dear " + TO + ",",
  "I don’t know when it happened, but somewhere between the small talks and the long silences, you became my favourite place to be.",
  "You make ordinary days feel soft and bright. Your smile fixes things I didn’t know were broken.",
  "So here it is, plainly: I love you. Today, tomorrow, and on every sleepy, silly day after that.",
  "Forever yours,",
  FROM + " ♥"
];
var REASONS = ["Your smile","Your hugs","Your laugh","Your kindness","Our silly talks","Just you"];

function $(id){return document.getElementById(id)}
function rnd(a,b){return a+Math.random()*(b-a)}

// falling hearts in the background
var rain = $("rain");
setInterval(function(){
  var h = document.createElement("i");
  h.textContent = ["💗","💕","🤍","💖"][Math.floor(rnd(0,4))];
  h.style.left = rnd(0,100)+"vw"; h.style.fontSize = rnd(14,30)+"px";
  h.style.animationDuration = rnd(7,13)+"s";
  rain.appendChild(h); setTimeout(function(){h.remove()},13000);
}, 900);

function burst(x, y, n){
  var set = ["💖","💗","💕","❤️","💘","🩷"];
  for(var i=0;i<n;i++){
    var s = document.createElement("div"); s.className="bit";
    s.textContent = set[i % set.length]; s.style.fontSize = rnd(18,38)+"px";
    document.body.appendChild(s);
    var a = rnd(0,Math.PI*2), d = rnd(80,Math.max(180,innerWidth*0.45));
    s.animate([
      {transform:"translate("+x+"px,"+y+"px) scale(.3)",opacity:1},
      {transform:"translate("+(x+Math.cos(a)*d)+"px,"+(y+Math.sin(a)*d-40)+"px) scale(1.2) rotate("+rnd(-60,60)+"deg)",opacity:0}
    ],{duration:rnd(900,1600),easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish = (function(el){return function(){el.remove()}})(s);
  }
}

// splash -> burst -> letter
$("go").addEventListener("click", function(){
  var r = this.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
  var big = $("bigheart");
  big.animate([{opacity:1,transform:"translate(-50%,-50%) scale(.2)"},{opacity:1,transform:"translate(-50%,-50%) scale(7)",offset:.6},{opacity:0,transform:"translate(-50%,-50%) scale(11)"}],{duration:1000,easing:"ease-out"});
  burst(cx,cy,34);
  setTimeout(function(){burst(cx,cy,22)},250);
  setTimeout(function(){
    $("splash").classList.add("out"); $("main").classList.add("show"); typeLetter();
  },700);
  this.disabled = true;
});

// typewriter
var skipped = false, finished = false;
function typeLetter(){
  var paper = $("paper"), pi = 0;
  function next(){
    if(pi >= LETTER.length){ done(); return; }
    var p = document.createElement("p"); p.className="cur"; paper.appendChild(p);
    var text = LETTER[pi], ci = 0;
    (function tick(){
      if(skipped){ p.textContent = text; p.className=""; pi++; return next(); }
      if(ci < text.length){ p.textContent = text.slice(0,++ci); setTimeout(tick, 32); }
      else { p.className=""; pi++; setTimeout(next, 350); }
    })();
  }
  next();
}
$("paper").addEventListener("click", function(){ skipped = true; });
function done(){
  if(finished) return; finished = true;
  $("skip").style.display = "none";
  setTimeout(function(){
    $("ask").classList.add("show");
    $("ask").scrollIntoView({behavior:"smooth",block:"center"});
  }, 500);
}

// the "No" button runs away
var no = $("no"), tries = 0, yesBtn = $("yes");
var labels = ["Are you sure?","Really?","Think again","Nope","Too slow","Pretty please?","Don’t break my heart","Wrong button","Try Yes","Missed me","Cat says no","Last chance"];
var hints = ["Oops, it moved 🙈","Missed me!","Try again? 😼","Yes is right there…","It’s okay, tap Yes 💗","The panda is watching 🐼","The cat is sad 😿","You can’t catch it 😆","Just say yes 🥺","Almost! Not really 😜","Yes is so much easier 💕","I’ll wait forever 💖"];
function dodge(e){
  if(e && e.cancelable) e.preventDefault();
  tries++;
  no.classList.add("run");
  no.textContent = labels[(tries-1) % labels.length];
  no.style.transform = "scale("+Math.max(1-tries*0.07,0.6)+")";
  var w = no.offsetWidth, h = no.offsetHeight, yr = yesBtn.getBoundingClientRect();
  var vw = window.innerWidth, vh = window.innerHeight, x, y, ok, n = 0;
  do{
    x = rnd(12, Math.max(13, vw-w-12));
    y = rnd(70, Math.max(71, vh-h-70));
    ok = x+w < yr.left-16 || x > yr.right+16 || y+h < yr.top-16 || y > yr.bottom+16;
    n++;
  } while(!ok && n < 40);
  no.style.left = x+"px"; no.style.top = y+"px";
  yesBtn.style.transform = "scale("+Math.min(1+tries*0.08,1.45)+")";
  $("hint").textContent = hints[(tries-1) % hints.length];
}
// pointerdown works for finger and mouse; the button moves before the tap lands
no.addEventListener("pointerdown", dodge);
no.addEventListener("mouseenter", dodge);
no.addEventListener("click", dodge);

// Yes
yesBtn.addEventListener("click", function(){
  var r = this.getBoundingClientRect();
  burst(r.left+r.width/2, r.top+r.height/2, 40);
  setTimeout(function(){burst(innerWidth/2, innerHeight/2, 30)}, 300);
  no.style.display = "none"; yesBtn.style.display = "none"; $("hint").style.display = "none";
  $("yes-msg").classList.add("show");
  var chips = $("chips");
  REASONS.forEach(function(t,i){
    var s = document.createElement("span"); s.textContent = "♥ " + t;
    s.style.animationDelay = (0.2+i*0.18)+"s"; chips.appendChild(s);
  });
  for(var k=0;k<5;k++) setTimeout(function(){burst(rnd(40,innerWidth-40), rnd(80,innerHeight-120), 14)}, 500+k*450);
});
</script>
</body>
</html>
